version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexora-postgres
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora_user
      POSTGRES_PASSWORD: nexora_secure_password_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora_user -d nexora"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexora-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    command: redis-server --appendonly yes --requirepass nexora_redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexora-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: nexora-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_secure_password_2024
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexora-network
    restart: unless-stopped

networks:
  nexora-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
